<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Золотая пластинка</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Onest","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
/* Стиль 1: «Свет» */
body.t1{
  --bg:#F5F2EC; --ink:#0E0E12; --ink2:#34343C; --muted:#6B6B75;
  --mark:#D6D2FF; --btn:#0E0E12; --btn-ink:#FFFFFF; --btn-hi:#2A2A33;
  --card:#FFFFFF; --edge:rgba(14,14,18,.16); --fill:#3D36F2;
}
/* Стиль 2: «Аврора» */
body.t2{
  --bg:#08080F; --ink:#FFFFFF; --ink2:rgba(255,255,255,.84); --muted:rgba(255,255,255,.62);
  --mark:rgba(150,130,255,.38); --btn:#FFFFFF; --btn-ink:#0A0A12; --btn-hi:#E9E6FF;
  --card:rgba(255,255,255,.08); --edge:rgba(255,255,255,.26); --fill:#B7AAFF;
}
/* Стиль 3: «Бледная точка» */
body.t3{
  --bg:#000000; --ink:#FFFFFF; --ink2:#D2D4DC; --muted:#9A9DA8;
  --mark:rgba(108,180,255,.32); --btn:#FFFFFF; --btn-ink:#000000; --btn-hi:#DDEBFF;
  --card:#0E1117; --edge:rgba(255,255,255,.22); --fill:#6CB4FF;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:500; line-height:1.55; overflow-x:hidden; transition:background .6s,color .6s}

/* прогресс сверху */
.pbar{position:fixed; left:0; top:0; right:0; height:4px; z-index:6; background:transparent}
.pbar i{display:block; height:100%; width:0; background:var(--fill); transition:width .7s cubic-bezier(.2,.7,.2,1)}

/* фон Авроры */
.aurora{position:fixed; inset:0; z-index:0; pointer-events:none; display:none; overflow:hidden}
body.t2 .aurora{display:block}
.aurora span{position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; animation:drift 22s ease-in-out infinite alternate}
.aurora span:nth-child(1){width:520px; height:520px; left:-120px; top:-140px; background:#6D4AFF}
.aurora span:nth-child(2){width:460px; height:460px; right:-140px; top:18%; background:#FF4D8D; animation-duration:28s; opacity:.38}
.aurora span:nth-child(3){width:520px; height:520px; left:20%; bottom:-260px; background:#2DD4FF; animation-duration:25s; opacity:.34}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}

/* звёзды только для «Бледной точки» */
.stars{position:fixed; inset:0; z-index:0; pointer-events:none; display:none;
  background-image:
    radial-gradient(1px 1px at 40px 60px,#fff,transparent),
    radial-gradient(1px 1px at 190px 170px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 320px 90px,#fff,transparent),
    radial-gradient(1px 1px at 410px 250px,#cfe0ff,transparent);
  background-size:470px 300px; opacity:.5}
body.t3 .stars{display:block}

.shell{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:26px 24px 140px; min-height:100vh; display:flex; flex-direction:column}
.brand{font-weight:800; font-size:.8rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); min-height:1.4em; opacity:0; transition:opacity .5s}
.brand.on{opacity:1}
main{flex:1; display:flex; flex-direction:column; justify-content:center; padding-top:10px}
.screen{animation:enter .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0; transform:translateY(22px)}to{opacity:1; transform:none}}

h1{font-weight:800; letter-spacing:-.03em; font-size:clamp(2.5rem,9vw,3.9rem); line-height:1.02; margin:.1em 0 .35em}
h1:focus{outline:none}
h1 .alt{display:block; margin-top:.25em; font-size:.46em; font-weight:700; letter-spacing:-.01em; color:var(--muted)}
.sub{font-size:1.1rem; color:var(--ink2); margin:0 0 1.6em}

/* герои */
.hero{height:210px; display:flex; align-items:center; margin-bottom:12px; position:relative}
.orb{width:160px; height:160px; border-radius:50%; background:radial-gradient(circle at 30% 28%,#fff 0,#C9C3FF 22%,#6A63FF 58%,#2A22B8 100%); box-shadow:0 34px 70px rgba(61,54,242,.38); animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.dotwrap{position:relative; width:100%; height:210px}
.dotwrap .ring{position:absolute; left:50%; top:50%; border-radius:50%; border:1px solid rgba(255,255,255,.16); transform:translate(-50%,-50%)}
.dotwrap .r1{width:90px; height:90px}
.dotwrap .r2{width:170px; height:170px; border-color:rgba(255,255,255,.1)}
.dotwrap .r3{width:260px; height:260px; border-color:rgba(255,255,255,.06)}
.dotwrap .pdot{position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:#8CC6FF; box-shadow:0 0 0 6px rgba(108,180,255,.15), 0 0 40px 10px rgba(108,180,255,.55); animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(108,180,255,.07), 0 0 60px 16px rgba(108,180,255,.7)}}
.nohero{height:40px}

/* кнопки */
.stack{display:grid; gap:14px}
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  min-height:68px; padding:14px 26px; border-radius:999px; cursor:pointer; border:none;
  font:700 1.2rem var(--sans); background:var(--btn); color:var(--btn-ink);
  transition:transform .25s, background .25s, opacity .25s;
}
.btn:hover{background:var(--btn-hi); transform:translateY(-2px)}
.btn:focus-visible,.link:focus-visible,.check:focus-within,summary:focus-visible{outline:3px solid var(--fill); outline-offset:3px}
.btn.off{opacity:.32; cursor:not-allowed}
.btn.off:hover{transform:none; background:var(--btn)}
.btn.line{background:transparent; color:var(--ink); border:2px solid var(--ink)}
.link{background:none; border:none; color:var(--muted); font:600 1rem var(--sans); cursor:pointer; padding:14px 4px; min-height:52px; text-decoration:underline; text-underline-offset:5px}
.hint{color:var(--ink); font-weight:700; min-height:1.6em; margin:.4rem 0}

/* список на согласии */
.points{list-style:none; padding:0; margin:0 0 1.2em}
.points li{font-size:1.28rem; font-weight:600; line-height:1.35; padding:.55em 0; border-bottom:1px solid var(--edge)}
.points li:last-child{border-bottom:none}
details{margin:.2em 0 1.2em; color:var(--ink2); font-size:.95rem}
summary{cursor:pointer; font-weight:600; font-style:italic; text-decoration:underline; text-underline-offset:5px; color:var(--ink); padding:10px 0; min-height:48px; list-style:none}
summary::-webkit-details-marker{display:none}
details p{margin:.5em 0}

.check{display:flex; gap:16px; align-items:center; padding:18px 20px; margin:12px 0; border:2px solid var(--edge); border-radius:20px; background:var(--card); cursor:pointer; transition:border-color .25s}
.check:has(input:checked){border-color:var(--fill)}
.check input{appearance:none; -webkit-appearance:none; width:32px; height:32px; flex:none; border:2.5px solid var(--ink); border-radius:10px; background:transparent; cursor:pointer; display:grid; place-content:center; margin:0}
.check input::after{content:""; width:16px; height:9px; border-left:4px solid var(--btn-ink); border-bottom:4px solid var(--btn-ink); transform:rotate(-45deg) translate(1px,-1px); opacity:0}
.check input:checked{background:var(--btn); border-color:var(--btn)}
.check input:checked::after{opacity:1}
.check span{font-size:1.1rem; font-weight:600; line-height:1.35}

/* задание */
.kicker{font-weight:800; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:.9em}
.task{font-size:clamp(1.9rem,6.4vw,2.7rem); font-weight:800; letter-spacing:-.025em; line-height:1.12; margin:0 0 .5em; color:var(--ink)}
.task2{font-size:clamp(1.25rem,4.4vw,1.6rem); font-weight:500; line-height:1.4; color:var(--ink2); margin:0 0 1.2em}
b.m{font-weight:800; color:var(--ink); background:linear-gradient(transparent 58%, var(--mark) 58%); padding:0 .08em}
.quiet{color:var(--muted); font-size:1.05rem; margin:0 0 1.8em}

#toast{position:fixed; left:50%; bottom:100px; transform:translate(-50%,20px); background:var(--btn); color:var(--btn-ink); padding:14px 22px; border-radius:999px; font-weight:700; opacity:0; pointer-events:none; transition:all .4s; z-index:8; max-width:92vw; text-align:center}
#toast.on{opacity:1; transform:translate(-50%,0)}

.dev{position:fixed; left:0; right:0; bottom:0; z-index:7; background:#000; border-top:1px solid #333; padding:6px 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; font:12px/1.2 var(--sans); color:#bbb}
.dev b{color:#fff; letter-spacing:.1em}
.dev button{min-height:30px; min-width:30px; border-radius:7px; border:1px solid #555; background:#111; color:#fff; cursor:pointer; font:inherit}
.dev button.on{background:#fff; color:#000; border-color:#fff}

/* ===== Стекло ===== */
.aurora span:nth-child(1){opacity:.7}
.aurora span:nth-child(2){opacity:.5}
.aurora span:nth-child(3){opacity:.46}
.gl,.check{
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.05)), rgba(12,9,32,.36);
  -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 24px 60px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.4);
  border-radius:28px;
}
.check{border-radius:22px; box-shadow:0 14px 36px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35)}
.check:has(input:checked){border-color:rgba(255,255,255,.75)}
.points.gl{padding:6px 24px; margin-bottom:14px}
.points li{border-bottom-color:rgba(255,255,255,.22)}
details.gl{padding:2px 22px; margin:0 0 14px; border-radius:22px}
.taskcard{padding:28px 26px 10px; margin-bottom:22px}
.taskcard .task2{margin-bottom:.8em}
.btn.glassbtn{
  background:linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.1)), rgba(12,9,32,.3);
  -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.45); color:#fff;
  box-shadow:0 14px 34px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.45);
}
.btn.glassbtn:hover{background:linear-gradient(135deg, rgba(255,255,255,.36), rgba(255,255,255,.16)), rgba(12,9,32,.25)}
/* ===== Карточки ===== */
.shell.wide{max-width:980px}
.chip{position:sticky; top:14px; z-index:5; display:inline-block; padding:10px 20px; border-radius:999px; font-size:.95rem; margin-bottom:6px}
.chip b{font-weight:800}
.h-cards{font-size:clamp(1.9rem,6vw,2.6rem); margin-top:.4em}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:14px 0 28px}
@media (min-width:720px){ .grid{grid-template-columns:repeat(3,1fr); gap:18px} }
@media (min-width:960px){ .grid{grid-template-columns:repeat(4,1fr)} }
button.card{
  position:relative; display:flex; flex-direction:column; padding:10px; border-radius:26px; cursor:pointer;
  color:#fff; font:inherit; text-align:left; border:1px solid rgba(255,255,255,.3);
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.05)), rgba(12,9,32,.36);
  -webkit-backdrop-filter:blur(20px) saturate(150%); backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 14px 34px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s, box-shadow .25s, border-color .25s, opacity .25s;
}
button.card:hover{transform:translateY(-3px)}
button.card:focus-visible{outline:3px solid #fff; outline-offset:3px}
.pic{position:relative; border-radius:18px; aspect-ratio:4/3; overflow:hidden}
.pic svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.pic .w{fill:#fff} .pic .v{fill:rgba(255,255,255,.55)} .pic .y{fill:#FFE27A} .pic .d{fill:rgba(18,12,48,.72)}
.pic .sw{fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.pic .sd{fill:none; stroke:rgba(18,12,48,.72); stroke-width:3; stroke-linecap:round}
.pic .sy{fill:none; stroke:#FFE27A; stroke-width:3; stroke-linecap:round}
.pic text{font-family:var(--sans); font-weight:800}
.cap{padding:10px 6px 6px; font-weight:700; font-size:.95rem; line-height:1.25; min-height:3.9em; display:flex; align-items:center}
.pic .w{fill:url(#gw)} .pic .v{fill:url(#gv)} .pic .y{fill:url(#gy)} .pic .d{fill:url(#gd)}
.pic svg{filter:drop-shadow(0 3px 3px rgba(20,10,70,.34))}
.pic::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:radial-gradient(120% 85% at 18% 0%, rgba(255,255,255,.3), rgba(255,255,255,0) 55%), linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(10,5,40,.22));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.tick{position:absolute; z-index:2; top:8px; right:8px; width:32px; height:32px; border-radius:50%; background:#fff; color:#14102b; display:grid; place-items:center; font-weight:800; font-size:1.05rem; transform:scale(0); transition:transform .25s cubic-bezier(.3,1.6,.5,1); box-shadow:0 4px 14px rgba(0,0,0,.35)}
button.card[aria-pressed="true"]{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 20px 44px rgba(0,0,0,.42); transform:translateY(-3px)}
button.card[aria-pressed="true"] .tick{transform:scale(1)}
.grid.full button.card[aria-pressed="false"]{opacity:.5}
.dock{position:sticky; bottom:var(--dockb,78px); z-index:6; display:flex; align-items:center; gap:16px; padding:14px 18px; border-radius:26px; flex-wrap:wrap}
.dock .info{flex:1; min-width:150px}
.dock .count{font-weight:700; font-size:1rem; margin-bottom:6px}
.dots{display:flex; gap:7px}
.dots i{width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,.28); transition:background .25s, transform .25s}
.dots i.on{background:#fff; transform:scale(1.15)}
.dock .btn{width:auto; min-width:170px; min-height:58px; flex:none}
/* ===== Возраст и итог ===== */
.opts{display:grid; gap:12px; margin:12px 0 24px}
.opt{display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:64px; padding:14px 22px; border-radius:22px; color:#fff; font:700 1.15rem var(--sans); cursor:pointer; text-align:left; transition:transform .25s, box-shadow .25s, border-color .25s}
.opt:hover{transform:translateY(-2px)}
.opt:focus-visible{outline:3px solid #fff; outline-offset:3px}
.opt::after{content:""; width:26px; height:26px; flex:none; border-radius:50%; border:2.5px solid #fff}
.opt[aria-checked="true"]{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 18px 40px rgba(0,0,0,.4)}
.opt[aria-checked="true"]::after{background:radial-gradient(circle,#fff 0 38%, #8F7BFF 41%)}
.mgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:14px 0 28px}
@media (min-width:720px){ .mgrid{grid-template-columns:repeat(4,1fr)} }
.mini{display:flex; flex-direction:column; padding:8px; border-radius:22px; border:1px solid rgba(255,255,255,.3);
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.05)), rgba(12,9,32,.36);
  -webkit-backdrop-filter:blur(20px) saturate(150%); backdrop-filter:blur(20px) saturate(150%)}
.mini .cap{min-height:3.4em; font-size:.9rem; padding:8px 4px 4px}
.mini.top{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.demo-tag{display:inline-block; padding:7px 14px; border-radius:999px; background:#FFE27A; color:#1a1405; font-weight:800; font-size:.8rem; letter-spacing:.06em; margin:4px 0 8px}
.panel2{padding:22px 24px; margin:0 0 18px}
.panel2 h2{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; margin:0 0 .4em}
.panel2 p{margin:.6em 0}
.matchline{font-weight:800; font-size:1.2rem; margin:10px 0 0}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
</head>
<body class="t1">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3DDFF"/></linearGradient>
  <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".78"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/></linearGradient>
  <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0AE"/><stop offset="1" stop-color="#FFC23D"/></linearGradient>
  <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2268" stop-opacity=".85"/><stop offset="1" stop-color="#150E3D" stop-opacity=".9"/></linearGradient>
</defs></svg>
<div class="pbar" aria-hidden="true"><i id="pfill"></i></div>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="stars" aria-hidden="true"></div>
<div class="shell">
  <div class="brand" id="brand">Золотая пластинка</div>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const T = {
  ru:{
    brand:"Золотая пластинка", back:"Назад",
    wH:"Прежде чем начать",
    points:["Научное исследование на четыре минуты.","Без имени, почты и адреса вашего устройства.","Закрыть страницу можно в любой момент."],
    more:"Подробнее об участии",
    moreP:["Правильных и неправильных ответов нет. Участие добровольное. Если вы закроете страницу до конца, неполные ответы мы не используем.","Вам предстоит собрать небольшую капсулу из карточек. Результаты изучаются только в обобщённом виде.","Ответы сохраняются в таблице Google, на серверах Google, и используются только для научного анализа."],
    chk18:"Мне 18 лет или больше", chkOk:"Я прочитал(а) это и согласен(на) участвовать",
    hint:"Отметьте оба пункта, чтобы продолжить", start:"Начать",
    contact:"Автор исследования: [контакт будет здесь]",
    kicker:"Ваша капсула",
    tasks:[
      ["Соберите капсулу для <b class='m'>соседа по дому</b>.","Он откроет её <b class='m'>через неделю</b> и <b class='m'>сможет вам ответить</b>."],
      ["Соберите капсулу для <b class='m'>людей будущего</b>.","Они откроют её <b class='m'>через 1000 лет</b> и <b class='m'>не смогут вам ответить</b>."],
      ["Соберите капсулу для <b class='m'>неизвестной цивилизации</b>.","Она в 10 000 световых лет от Земли, откроет капсулу <b class='m'>через 10 000 лет</b> и <b class='m'>не сможет вам ответить</b>."]
    ],
    quiet:"Выберите семь карточек из сорока.", go:"К карточкам", stub:"В прототипе экранов с карточками пока нет."
  },
  kk:{
    brand:"Алтын пластинка", back:"Артқа",
    wH:"Бастамас бұрын",
    points:["Төрт минутқа арналған ғылыми зерттеу.","Атыңыз, поштаңыз және құрылғыңыздың мекенжайы сұралмайды.","Бетті кез келген уақытта жаба аласыз."],
    more:"Қатысу туралы толығырақ",
    moreP:["Дұрыс немесе бұрыс жауап жоқ. Қатысу ерікті. Бетті соңына дейін жауып тастасаңыз, аяқталмаған жауаптарды пайдаланбаймыз.","Сізге карточкалардан шағын капсула жинау керек. Нәтижелер тек жиынтық түрде зерттеледі.","Жауаптар Google кестесінде, Google серверлерінде сақталады және тек ғылыми талдау үшін қолданылады."],
    chk18:"Мен 18 жастамын немесе одан үлкенмін", chkOk:"Мен мұны оқыдым және қатысуға келісемін",
    hint:"Жалғастыру үшін екі тармақты да белгілеңіз", start:"Бастау",
    contact:"Зерттеу авторы: [байланыс осында болады]",

const HUES = [["#8A6BFF","#3B2DB5"],["#FF6FA5","#B0338F"],["#2FD2E6","#1E6FD0"],["#FFB057","#F2554E"],["#4FD6A1","#1B8C8F"],["#5C8CFF","#3A3FC6"]];
let order = null; const picked = new Set();
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const TOTAL = 6;
let screen = 0, lang = null, style = 2, group = Math.floor(Math.random()*3);
let ok18 = false, okConsent = false;
const app = document.getElementById('app');
const brand = document.getElementById('brand');
const toastEl = document.getElementById('toast');
const pfill = document.getElementById('pfill');
const t = () => T[lang || 'ru'];
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 2600); }

function hero(){
  if(style === 1) return `<div class="hero"><div class="orb"></div></div>`;
  if(style === 3) return `<div class="hero"><div class="dotwrap"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><div class="pdot"></div></div></div>`;
  return `<div class="nohero"></div>`;
}

function render(){
  document.body.className = 't' + style;
  document.querySelector('.shell').classList.toggle('wide', screen === 3);
  document.documentElement.lang = lang || 'ru';
  brand.textContent = t().brand;
  brand.classList.toggle('on', screen > 0);
  pfill.style.width = (screen === 0 ? 0 : ((screen+1)/TOTAL*100)) + '%';

  if(alreadyDone() && screen < 5){
    app.innerHTML = `<section class="screen"><h1 class="h-cards" tabindex="-1">${t().done2}</h1></section>`;
    return;
  }

  if(screen === 0){
    app.innerHTML = `
      <section class="screen">
        ${hero()}
        <h1 tabindex="-1">Золотая пластинка<span class="alt">Алтын пластинка</span></h1>
        <p class="sub">Исследование на четыре минуты · Төрт минутқа арналған зерттеу</p>
        <div class="stack">
          <button class="btn glassbtn" data-lang="ru">Русский</button>
          <button class="btn glassbtn" data-lang="kk">Қазақша</button>
        </div>
      </section>`;
    app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; screen=1; render(); });
  }
  else if(screen === 1){
    const L = t();
    app.innerHTML = `
      <section class="screen">
        <h1 tabindex="-1">${L.wH}</h1>
        <ul class="points gl">${L.points.map(x=>`<li>${x}</li>`).join('')}</ul>
        <details class="gl"><summary>${L.more}</summary>${L.moreP.map(x=>`<p>${x}</p>`).join('')}<p>${L.contact}</p></details>
        <label class="check"><input type="checkbox" id="c18" ${ok18?'checked':''}><span>${L.chk18}</span></label>
        <label class="check"><input type="checkbox" id="cok" ${okConsent?'checked':''}><span>${L.chkOk}</span></label>
        <div class="hint" id="hint"></div>
        <button class="btn off" id="startBtn" aria-disabled="true">${L.start}</button>
        <button class="link" id="backBtn">← ${L.back}</button>
      </section>`;
    const c18 = app.querySelector('#c18'), cok = app.querySelector('#cok'),
          btn = app.querySelector('#startBtn'), hint = app.querySelector('#hint');
    const sync = ()=>{
      ok18 = c18.checked; okConsent = cok.checked;
      const ready = ok18 && okConsent;
      btn.classList.toggle('off', !ready); btn.setAttribute('aria-disabled', String(!ready));
      if(ready) hint.textContent = '';
    };
    c18.onchange = cok.onchange = sync; sync();
    btn.onclick = ()=>{ if(!(ok18 && okConsent)){ hint.textContent = L.hint; return; } screen = 2; render(); };
    app.querySelector('#backBtn').onclick = ()=>{ screen = 0; render(); };
  }
  else if(screen === 2){
    const L = t(), g = L.tasks[group];
    app.innerHTML = `
      <section class="screen">
        <div class="gl taskcard">
          <div class="kicker">${L.kicker}</div>
          <h1 class="task" tabindex="-1" style="font-size:clamp(1.9rem,6.4vw,2.7rem);letter-spacing:-.025em;line-height:1.12;margin:0 0 .5em">${g[0]}</h1>
          <p class="task2">${g[1]}</p>
        </div>
        <p class="quiet">${L.quiet}</p>
        <button class="btn" id="goBtn">${L.go} →</button>
        <button class="link" id="backBtn">← ${L.back}</button>
      </section>`;
    app.querySelector('#goBtn').onclick = ()=>{ screen = 3; render(); };
    app.querySelector('#backBtn').onclick = ()=>{ screen = 1; render(); };
  }
  if(screen === 3){
    const L = t(); if(!order) order = shuffle([...Array(CARDS.length).keys()]);
    const card = i => {
      const c = CARDS[i], h = HUES[(i*5) % 6], on = picked.has(i);
      return `<button class="card" data-i="${i}" aria-pressed="${on}">
        <div class="pic" style="background:linear-gradient(160deg,${h[0]},${h[1]})">${c.svg}<span class="tick" aria-hidden="true">✓</span></div>
        <div class="cap">${lang==='kk' ? c.kk : c.ru}</div></button>`;
    };
    app.innerHTML = `
      <section class="screen">
        <div class="chip gl">${L.chip} <b>${L.chips[group]}</b></div>
        <h1 class="h-cards" tabindex="-1">${L.cH}</h1>
        <p class="sub" style="margin-bottom:.4em">${L.cHint}</p>
        <div class="grid" id="grid">${order.map(card).join('')}</div>
        <div class="dock gl">
          <div class="info"><div class="count" id="count"></div><div class="dots" id="dots" aria-hidden="true">${'<i></i>'.repeat(7)}</div></div>
          <button class="btn off" id="doneBtn" aria-disabled="true">${L.done} →</button>
        </div>
      </section>`;
    const grid = app.querySelector('#grid'), cnt = app.querySelector('#count'),
          dots = app.querySelectorAll('#dots i'), done = app.querySelector('#doneBtn');
    const sync = () => {
      cnt.textContent = L.sel(picked.size);
      dots.forEach((d,k)=>d.classList.toggle('on', k < picked.size));
      grid.classList.toggle('full', picked.size >= 7);
      const ready = picked.size === 7;
      done.classList.toggle('off', !ready); done.setAttribute('aria-disabled', String(!ready));
    };
    grid.onclick = e => {
      const b = e.target.closest('.card'); if(!b) return;
      const i = +b.dataset.i;
      if(picked.has(i)){ picked.delete(i); b.setAttribute('aria-pressed','false'); }
      else if(picked.size >= 7){ toast(L.full); return; }
      else { picked.add(i); b.setAttribute('aria-pressed','true'); }
      sync();
    };
    done.onclick = () => { if(picked.size === 7){ screen = 4; render(); } };
    sync();
  }
  if(screen === 4){
    const L = t();
    app.innerHTML = `
      <section class="screen">
        <div class="kicker">${L.aK}</div>
        <h1 class="h-cards" tabindex="-1">${L.aH}</h1>
        <p class="sub">${L.aP}</p>
        <div class="opts" role="radiogroup" aria-label="${L.aH}">
          ${L.ages.map((o,k)=>`<button class="opt gl" role="radio" aria-checked="${age===k}" data-k="${k}">${o}</button>`).join('')}
        </div>
        <button class="btn off" id="finBtn" aria-disabled="true">${L.fin} →</button>
        <button class="link" id="backBtn">← ${L.back}</button>
      </section>`;
    const fin = app.querySelector('#finBtn');
    const syncA = () => { const ready = age !== null; fin.classList.toggle('off', !ready); fin.setAttribute('aria-disabled', String(!ready)); };
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      age = +b.dataset.k;
      app.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', String(+x.dataset.k === age)));
      syncA();
    });
    fin.onclick = () => {
      if(age === null) return;
      const rec = { ver:SITE_VER, pid:newPid(), group, lang, ageBand:age, picks:[...picked], order:[...order],
                    ms:Date.now()-startedAt, device: innerWidth < 720 ? 'phone' : 'desktop' };
      window.__record = rec;
      fin.classList.add('off');
      sendRecord(rec).then(st => { window.__sendStatus = st; if(st === 'ok' || st === 'sent-unconfirmed') markDone(); });
      screen = 5; render();
    };
    app.querySelector('#backBtn').onclick = () => { screen = 3; render(); };
    syncA();
  }
  if(screen === 5){
    const L = t(), mine = [...picked], top = showDemo ? DEMO_TOP : null;
    const tile = (i, cls='') => { const c = CARDS[i], h = HUES[(i*5) % 6];
      return `<div class="mini ${cls}"><div class="pic" style="background:linear-gradient(160deg,${h[0]},${h[1]})">${c.svg}</div><div class="cap">${lang==='kk' ? c.kk : c.ru}</div></div>`; };
    const overlap = top ? mine.filter(i => top.includes(i)).length : 0;
    app.innerHTML = `
      <section class="screen">
        <h1 class="h-cards" tabindex="-1">${L.rH}</h1>
        <p class="sub">${L.rSub}</p>
        <div class="mgrid">${mine.map(i => tile(i, top && top.includes(i) ? 'top' : '')).join('')}</div>
        <div class="gl panel2">
          <h2>${L.gH}</h2>
          ${top ? `<span class="demo-tag">${L.demo}</span><div class="mgrid" style="margin-bottom:8px">${top.map(i => tile(i)).join('')}</div><div class="matchline">${L.match(overlap)}</div>` : `<p>${L.gNo}</p>`}
        </div>
        <div class="gl panel2">
          <h2>${L.dH}</h2>
          ${L.dP.map(x => `<p>${x}</p>`).join('')}
          <p><b>${L.youHad}</b> ${L.who[group]}.</p>
          <p class="small">${L.contact}</p>
        </div>
      </section>`;
  }
  const h = app.querySelector('h1'); if(h) h.focus({preventScroll:true});
}

render();
</script>
</body>
</html>
